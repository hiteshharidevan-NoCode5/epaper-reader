name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Flutter Create Platform Files
        run: flutter create . --org com.example --project-name epaper_reader

      - name: Configure Android Project
        run: |
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle
          sed -i '/<application/i <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>' android/app/src/main/AndroidManifest.xml

      - name: Add PDF Intent Filter
        run: |
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          f = """<intent-filter>
            <action android:name="android.intent.action.VIEW"/>
            <action android:name="android.intent.action.EDIT"/>
            <category android:name="android.intent.category.DEFAULT"/>
            <category android:name="android.intent.category.BROWSABLE"/>
            <data android:scheme="content" android:mimeType="application/pdf"/>
            <data android:scheme="file" android:mimeType="application/pdf"/>
            <data android:host="*" android:mimeType="application/pdf"/>
            <data android:pathPattern=".*\\\\.pdf"/>
          </intent-filter></activity>"""
          open(p, "w").write(s.replace("</activity>", f, 1))
          '

      - name: Add Native Content Resolver
        run: |
          cat << 'KOTLIN' > android/app/src/main/kotlin/com/example/epaper_reader/MainActivity.kt
          package com.example.epaper_reader

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.OpenableColumns
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "epaper_reader/intent"
              private var pendingIntent: Intent? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  pendingIntent = intent
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  flutterEngine?.dartExecutor?.binaryMessenger?.let { m ->
                      val data = extractPdf(intent)
                      if (data != null) {
                          MethodChannel(m, CHANNEL).invokeMethod("onNewPdf", data)
                      }
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  val messenger = flutterEngine.dartExecutor.binaryMessenger
                  MethodChannel(messenger, CHANNEL).setMethodCallHandler { call, res ->
                      if (call.method == "getInitialPdf") {
                          val data = pendingIntent?.let { extractPdf(it) }
                          pendingIntent = null
                          res.success(data)
                      } else {
                          res.notImplemented()
                      }
                  }
              }

              private fun extractPdf(intent: Intent): Map<String, Any>? {
                  val uri: Uri = intent.data ?: return null
                  return try {
                      val stream = contentResolver.openInputStream(uri) ?: return null
                      val bytes = stream.use { it.readBytes() }
                      var title = "ePaper Edition"
                      contentResolver.query(uri, null, null, null, null)?.use { c ->
                          val idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (idx != -1 && c.moveToFirst()) {
                              title = c.getString(idx) ?: title
                          }
                      }
                      mapOf("bytes" to bytes, "title" to title)
                  } catch (e: Exception) {
                      null
                  }
              }
          }
          KOTLIN

      - name: Get Dependencies
        run: flutter pub get

      - name: Build and Rename APK
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/epaper-reader.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: epaper-reader
          path: build/app/outputs/flutter-apk/epaper-reader.apk
          retention-days: 1
