name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - run: flutter create . --org com.example --project-name epaper_reader
      - run: pip install pillow && python3 .github/scripts/setup_build.py
      - run: |
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle
          cp .github/scripts/MainActivity.kt android/app/src/main/kotlin/com/example/epaper_reader/MainActivity.kt
      - run: flutter pub get
      - run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NuzEPpr.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NuzEPpr
          path: build/app/outputs/flutter-apk/NuzEPpr.apk
          retention-days: 1
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NuzEPpr Latest Build
          files: build/app/outputs/flutter-apk/NuzEPpr.apk
          make_latest: true
