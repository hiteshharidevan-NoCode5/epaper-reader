name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Flutter Create Platform Files
        run: flutter create . --org com.example --project-name epaper_reader

      - name: Configure Android Project (SDK & Kotlin & PDF Handler)
        run: |
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle

          INTENT_FILTER='<intent-filter><action android:name="android.intent.action.VIEW"\/><category android:name="android.intent.category.DEFAULT"\/><category android:name="android.intent.category.BROWSABLE"\/><data android:scheme="content" android:mimeType="application\/pdf"\/><data android:scheme="file" android:mimeType="application\/pdf"\/><\/intent-filter>'
          sed -i "s/<\/activity>/$INTENT_FILTER<\/activity>/" android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: epaper-reader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
